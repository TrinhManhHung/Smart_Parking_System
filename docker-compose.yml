version: '3.8'

services:
  auth-service:
    build: ./services/auth-service
    ports:
      - "8001:8001"
    volumes:
      - ./services/auth-service:/app
    environment:
      - PYTHONPATH=/app

  parking-service:
    build: ./services/parking-service
    ports:
      - "8002:8002"
    volumes:
      - ./services/parking-service:/app
    environment:
      - PYTHONPATH=/app

  reservation-service:
    build: ./services/reservation-service
    ports:
      - "8003:8003"
    volumes:
      - ./services/reservation-service:/app
    environment:
      - PYTHONPATH=/app
    depends_on:
      - parking-service

  recommendation-service:
    build: ./services/recommendation-service
    ports:
      - "8004:8004"
    volumes:
      - ./services/recommendation-service:/app
    environment:
      - PYTHONPATH=/app
    depends_on:
      - parking-service

  payment-service:
    build: ./services/payment-service
    ports:
      - "8005:8005"
    volumes:
      - ./services/payment-service:/app
    environment:
      - PYTHONPATH=/app
    depends_on:
      - parking-service

  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    volumes:
      - ./gateway:/app
    environment:
      - PYTHONPATH=/app
    depends_on:
      - auth-service
      - parking-service
      - reservation-service
      - recommendation-service
      - payment-service

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      - gateway